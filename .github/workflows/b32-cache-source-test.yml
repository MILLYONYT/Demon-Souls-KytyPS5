name: KytyPS5 B131 allocation and shader preparation
on:
  push:
    branches: [best131-inplace-shader-preparation]
    paths:
      - .github/workflows/b32-cache-source-test.yml
      - patches/b123-combined-renderer-performance.patch
      - patches/b127-index-descriptor-reuse.patch
      - patches/b131-inplace-shader-preparation.patch
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    name: Build frozen B131 plus shader preparation allocation reductions
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout public performance source
        uses: actions/checkout@v4
        with:
          repository: chenxiao07/KytyPS5
          ref: bb0fbe7e9f22d9bf2455f486fbf1a9aa33a6354d
          path: source
          submodules: false
      - name: Pin available audio dependency and fetch submodules
        shell: pwsh
        run: |
          # The fork's ATRAC9 gitlink points to an unpublished commit.
          # Use an available public ATRAC9 revision; no user emulator patches are applied.
          git -C source update-index --cacheinfo 160000,ec8899dadf393f655f2871a94e0fe4b3d6220c9a,3rdparty/LibAtrac9
          if ($LASTEXITCODE) { throw 'Audio dependency pin failed' }
          git -C source submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE) { throw 'Source dependency checkout failed' }
          $actual = git -C source/3rdparty/LibAtrac9 rev-parse HEAD
          if ($actual -ne 'ec8899dadf393f655f2871a94e0fe4b3d6220c9a') { throw 'Unexpected ATRAC9 revision' }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install tested LLVM compiler
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '19.1.7'
      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Split-Path (Get-Command vcpkg).Source
          $hash = (Get-FileHash "$root\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "root=$root" >> $env:GITHUB_OUTPUT
          "port_hash=$hash" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: glslang_cache
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt
      - name: Install glslang
        shell: pwsh
        run: |
          $root = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
            if ($LASTEXITCODE) { throw 'glslang install failed' }
          }
          "$root\installed\x64-windows\tools\glslang" >> $env:GITHUB_PATH
      - name: Fix indexed draw shader initialization order
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('indexed-shader-init.patch', [Convert]::FromBase64String(''))
          git -C source apply --check ../indexed-shader-init.patch
          if ($LASTEXITCODE) { throw 'Indexed shader initialization patch does not match upstream' }
          git -C source apply ../indexed-shader-init.patch
          if ($LASTEXITCODE) { throw 'Indexed shader initialization patch failed' }
      - name: Apply frozen B123 performance code and reviewed cache/compiler fixes
        shell: pwsh
        run: |
          git -C source apply --check ../patches/b123-combined-renderer-performance.patch
          if ($LASTEXITCODE) { throw 'Proven FPS ports do not match pinned source' }
          git -C source apply ../patches/b123-combined-renderer-performance.patch
          if ($LASTEXITCODE) { throw 'Proven FPS port failed; refusing a partial build' }
      - name: Expose existing CPU draw argument checks without a Vulkan device
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('draw-run-cpu-selector.patch', [Convert]::FromBase64String(''))
          git -C source apply --check ../draw-run-cpu-selector.patch
          if ($LASTEXITCODE) { throw 'CPU draw argument selector does not match source' }
          git -C source apply ../draw-run-cpu-selector.patch
          if ($LASTEXITCODE) { throw 'CPU draw argument selector patch failed' }
      - name: Apply reviewed index and descriptor reuse fixes
        shell: pwsh
        run: |
          git -C source apply --check ../patches/b127-index-descriptor-reuse.patch
          if ($LASTEXITCODE) { throw 'B127 incremental reuse patch does not match' }
          git -C source apply ../patches/b127-index-descriptor-reuse.patch
          if ($LASTEXITCODE) { throw 'B127 incremental reuse patch failed' }
      - name: Apply B131 shader preparation allocation reductions
        shell: pwsh
        run: |
          git -C source apply --check ../patches/b131-inplace-shader-preparation.patch
          if ($LASTEXITCODE) { throw 'Shader preparation patch does not match frozen B131 source' }
          git -C source apply ../patches/b131-inplace-shader-preparation.patch
          if ($LASTEXITCODE) { throw 'Shader preparation patch failed' }
      - name: Configure portable optimized build
        shell: cmd
        run: >
          cmake -S source -B _Build/windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DKYTY_BUILD_LAUNCHER=OFF
          -DKYTY_MARCH=x86-64-v3 -DKYTY_THIN_LTO=ON
          -DKYTY_BUILD_ORIGIN=Fork -DKYTY_BUILD_REPOSITORY=${{ github.repository }}
          -DKYTY_RELEASE_TAG=B131-SHADER-PREP-${{ github.run_number }}
          "-DCMAKE_CXX_FLAGS=/DWIN32 /D_WINDOWS /W3 /GR /EHsc /DKYTY_B32_FAST_CPU_SETS /DKYTY_B32_QUIET_SHADER_PHASES"
          -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
      - name: Verify required Windows compiler flags
        shell: pwsh
        run: |
          $flags = (Select-String -Path _Build/windows/CMakeCache.txt -Pattern '^CMAKE_CXX_FLAGS:STRING=').Line
          foreach ($required in @('/EHsc','/GR','/DWIN32','/D_WINDOWS','/DKYTY_B32_FAST_CPU_SETS','/DKYTY_B32_QUIET_SHADER_PHASES')) {
            if (!$flags.Contains($required)) { throw "Required compiler setting missing: $required" }
          }
      - name: Build emulator and shader preparation
        run: cmake --build _Build/windows --target kyty_emulator kyty_shader_precompile --parallel 4
      - name: Build resource, SRT and shader compiler regression checks
        run: cmake --build _Build/windows --target resource_tracking_tests resource_materialization_tests compute_frontend_cache_tests scalar_provenance_tests shader_cfg_tests guest_readback_packing_tests shader_recompiler_compute_tests vulkan_recording_tests --parallel 4
      - name: Run resource and compiler regression checks with IR validation
        shell: pwsh
        run: |
          # Upstream's full resource fixture assumes the legacy layout.
          # Test that layout without modifying its tests or production defaults.
          $env:KYTY_PORTABLE_SHADERS = '0'
          $env:KYTY_IR_VALIDATE = '1'
          ctest --test-dir _Build/windows --output-on-failure -R "^(resource_tracking|resource_materialization|compute_frontend_cache|scalar_provenance|shader_cfg|guest_readback_packing)$"
          if ($LASTEXITCODE) { throw 'Compiler/resource regression checks failed' }
          Remove-Item Env:KYTY_IR_VALIDATE
          ctest --test-dir _Build/windows --output-on-failure -R "^(scalar_provenance|shader_cfg)$"
          if ($LASTEXITCODE) { throw 'Release compiler regression checks failed' }
          & _Build/windows/shader_recompiler_compute_tests.exe --gpu-math-emission-only
          if ($LASTEXITCODE) { throw 'GPU math SPIR-V emission checks failed' }
          & _Build/windows/vulkan_recording_tests.exe
          if ($LASTEXITCODE) { throw 'CPU mocked Vulkan recording ordering and ownership checks failed' }
          & _Build/windows/shader_recompiler_compute_tests.exe --draw-run-arguments-only
          if ($LASTEXITCODE) { throw 'CPU draw argument checks failed' }

      - name: Verify frozen rendering fix and exact performance patch
        shell: pwsh
        run: |
          git -C source apply --reverse --check ../indexed-shader-init.patch
          if ($LASTEXITCODE) { throw 'Frozen indexed shader fix missing' }
          git -C source apply --reverse --check ../draw-run-cpu-selector.patch
          if ($LASTEXITCODE) { throw 'CPU draw argument selector missing' }
          git -C source apply --reverse --check ../patches/b131-inplace-shader-preparation.patch
          if ($LASTEXITCODE) { throw 'Shader preparation patch missing' }
          git -C source apply --reverse ../patches/b131-inplace-shader-preparation.patch
          if ($LASTEXITCODE) { throw 'Shader preparation verification undo failed' }
          git -C source apply --reverse --check ../patches/b127-index-descriptor-reuse.patch
          if ($LASTEXITCODE) { throw 'B127 reuse patch missing' }
          git -C source apply --reverse ../patches/b127-index-descriptor-reuse.patch
          if ($LASTEXITCODE) { throw 'Incremental verification undo failed' }
          git -C source apply --reverse --check ../patches/b123-combined-renderer-performance.patch
          if ($LASTEXITCODE) { throw 'Compiled source differs from the reviewed performance port' }
          git -C source apply ../patches/b127-index-descriptor-reuse.patch
          if ($LASTEXITCODE) { throw 'Incremental verification restore failed' }
          git -C source apply ../patches/b131-inplace-shader-preparation.patch
          if ($LASTEXITCODE) { throw 'Shader preparation verification restore failed' }
      - name: Package portable candidate
        shell: pwsh
        run: |
          $out = '_Build/package'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item _Build/windows/kyty_emulator.exe,_Build/windows/kyty_shader_precompile.exe,_Build/windows/libwinpthread-1.dll $out
          Copy-Item source/run-windows.ps1,source/precompile-windows.ps1 $out
          # Honor the settings window's saved vblank; explicit -Vblank takes precedence.
          $launcher = Get-Content "$out/run-windows.ps1" -Raw
          $oldVblank = @'
          Set-Option '--vblank-frequency' "$(if ($Vblank -gt 0) { $Vblank } else { 60 })"
          '@
          $newVblank = @'
          if ($Vblank -gt 0) {
              if ($Vblank -lt 30 -or $Vblank -gt 360) { throw 'Vblank frequency must be between 30 and 360 Hz' }
              Set-Option '--vblank-frequency' "$Vblank"
          } elseif ($options.IndexOf('--vblank-frequency') -lt 0) {
              Set-Option '--vblank-frequency' '60'
          }
          '@
          if (!$launcher.Contains($oldVblank)) { throw 'Vblank launcher patch does not match pinned source' }
          $launcher = $launcher.Replace($oldVblank, $newVblank)
          [IO.File]::WriteAllText("$out/run-windows.ps1", $launcher, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllBytes("$out/settings.ps1", [Convert]::FromBase64String(''))
          Set-Content "$out/settings.cmd" -Encoding ASCII -Value @(
            '@echo off',
            'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0settings.ps1"',
            'if errorlevel 1 pause')
          # No files, patches, or configuration from ci/perf40 or the user's builds.
          @{ checkpoint='b131-inplace-shader-preparation'; environment=@{}; command=@('--','kyty_emulator.exe','--shader-optimization-type','Performance','--shader-log-direction','Silent','--printf-direction','Silent') } |
            ConvertTo-Json -Depth 4 | Set-Content "$out/launch.json" -Encoding UTF8
          Set-Content "$out/run.cmd" -Encoding ASCII -Value @(
            '@echo off',
            'if /I "%~1"=="settings" goto settings',
            'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0run-windows.ps1" -Baseline -Prompt -Set KYTY_PORTABLE_SHADERS=0,KYTY_DRIVER_CACHE_KEY=98edcf312ef7ea126af9bb5a876005fc746955313ea0535ba2563c766289753b,KYTY_SHADER_WARMUP=1,KYTY_SHADER_WARMUP_THREADS=12,KYTY_SHADER_WARMUP_SECONDS=60,KYTY_SHADER_WARMUP_FILE=_PipelineCache/warmup-legacy/recording.shaders,KYTY_PREPARATION_SCRATCH=1,KYTY_DISPATCH_BATCH=128,KYTY_BACKING_READ=1,KYTY_FRAME_PIPELINE=1,KYTY_READBACK_QUEUE=1,KYTY_READBACK_SLOTS=1,KYTY_ASYNC_UPLOAD=2,KYTY_BDA_DIRTY_REGIONS=1,KYTY_NATIVE_XPR=1,KYTY_NATIVE_XPR_RELOCATE=1,KYTY_NATIVE_XPR_STORE_BUDGET=256,KYTY_NATIVE_XPR_KEEP_FRAMES=600,KYTY_NATIVE_IMAGE_PROOF=1,KYTY_ASYNC_XPR_PIPELINES=1,KYTY_VULKAN_RECORDING=0,KYTY_DEFERRED_SUBMIT=0 %*',
            'goto finish',
            ':settings',
            'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0settings.ps1"',
            ':finish',
            'if errorlevel 1 pause')
          Set-Content "$out/precompile.cmd" -Encoding ASCII -Value @(
            '@echo off',
            'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0precompile-windows.ps1" %*',
            'if errorlevel 1 pause')
          $verify = (Get-Content "$out/run.cmd" -Raw).Replace('KYTY_NATIVE_XPR=1','KYTY_NATIVE_XPR=2')
          [IO.File]::WriteAllText("$out/run-verify.cmd", $verify, [Text.ASCIIEncoding]::new())
          Set-Content "$out/README.txt" -Value @(
            'Frozen user-confirmed B131 plus in-place shader resource specialization, in-place interface collection and reusable indirect descriptor sort storage.',
            'Uses B127 synchronous recording/submission; KYTY_VULKAN_RECORDING=0 and KYTY_DEFERRED_SUBMIT=0 are explicitly enforced.',
            'CPU-dirty small index ranges synchronize once until the next guest write.',
            'GPU-completed descriptor reuse retains up to 2048 per layout and 16384 total.',
            'Preserves the exact B127 legacy cache key and shader code; keep your working B131 cache.',
            'Driver cache survives warmup saves and keeps caching later gameplay pipelines.',
            'Shader compiler uses hash-bucketed SRT planning, linear use-list rewrites and cheaper SPIR-V declarations.',
            'Release skips redundant IR validation; compiler tests also run with KYTY_IR_VALIDATE=1.',
            'Readback copies nearby GPU ranges together, writing back only the original dirty bytes.',
            'Native draw-record reuse and relocation enabled, 256 stores per frame, 600-frame retention.',
            'GPU range proofs and async uploads reduce redundant synchronization and unrelated unmap waits.',
            'BDA buffers up to 64 MiB share VMA blocks; exact fp32 helpers emit fewer GPU instructions.',
            'run-verify.cmd compares native draw records with normal preparation for rendering diagnostics.',
            'B131 is frozen separately at best131-frozen-stable-vblank-textures-audio; B127 remains available.',
            'Shader replay records on first use; judge smoothness on a second launch through the same scene.',
            'Restores B102 replay, B103 compute frontend reuse and quiet logging, GPU worker CPU sets/priority/QoS, SRT visited-set lookup, scratch capacity reuse and 128-dispatch batching.',
            'Fix: indexed indirect draws initialize the shader before checking its mesh stage.',
            'Extract into a new folder. Keep your B131 folder as the comparison baseline.',
            'You may COPY the working B131 _PipelineCache into this candidate; keep the original cache too.',
            'Do not copy old launch.json, patches or DLLs into the candidate.',
            'Run run.cmd and choose the folder containing eboot.bin.',
            'Open settings.cmd (or run.cmd settings) to change display, GPU, vblank frequency, shader optimization and logging settings.',
            'Click Save, then relaunch the game. Settings are stored in launch.json.',
            'Vblank frequency supports 30-360 Hz, defaults to 60, and persists. An explicit run-windows.ps1 -Vblank value overrides the saved setting.',
            'Uses upstream Baseline launcher plus explicit combined performance overrides; new renderer paths need gameplay testing.',
            'The upstream Windows red-zone protection and logs remain enabled.',
            'Texture compatibility test: legacy shader bindings (KYTY_PORTABLE_SHADERS=0) with a separate driver cache key.',
            'Portable shaders stay disabled. Native XPR and async readback enabled; draw packets and partial image dirty experiments stay off.',
            'B131 is user-confirmed stable. This shader-preparation candidate targets compilation/allocation stalls and requires gameplay validation.',
            'This is not the private benchmark package. No private PGO, SRT AOT or game shader seeds.',
            'ATRAC9 uses public revision ec8899dadf393f655f2871a94e0fe4b3d6220c9a because the source gitlink is unavailable.',
            'Legacy resource tracking, materialization scratch/reentrancy checks and frontend cache lifetime/collision/concurrency/eviction checks run in CI.',
            'Mocked recording/submission checks run in CI. GPU execution and draw-range rasterization require a Vulkan-capable machine and are not certified by CI.')
          New-Item -ItemType Directory -Force "$out/tools/local" | Out-Null
          Copy-Item source/tools/local/static-precompile "$out/tools/local/" -Recurse
          New-Item -ItemType Directory -Force "$out/3rdparty/Vulkan-Headers/include/vulkan","$out/src/graphics/guest_gpu" | Out-Null
          Copy-Item source/3rdparty/Vulkan-Headers/include/vulkan/vulkan_core.h "$out/3rdparty/Vulkan-Headers/include/vulkan/"
          Copy-Item source/src/graphics/guest_gpu/gpu_defs.h "$out/src/graphics/guest_gpu/"
          Copy-Item source/3rdparty/winpthread/COPYING "$out/WINPTHREAD-COPYING.txt"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-Item "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" |
            Where-Object { $_.Parent.Parent.Name -match '^\d+\.' } |
            Sort-Object { [version]$_.Parent.Parent.Name } | Select-Object -Last 1
          if (!$crt) { throw 'VC runtime redistributables missing' }
          Copy-Item "$($crt.FullName)\msvcp140*.dll","$($crt.FullName)\vcruntime140*.dll" $out
          Copy-Item source/LICENSE "$out/LICENSE.txt"
          Copy-Item source/LICENSES "$out/LICENSES" -Recurse
          @{
            source_repository='chenxiao07/KytyPS5'
            source_commit='bb0fbe7e9f22d9bf2455f486fbf1a9aa33a6354d'
            atrac9_commit='ec8899dadf393f655f2871a94e0fe4b3d6220c9a'
            unpublished_atrac9_optimization_included=$false
            packaging_commit=$env:GITHUB_SHA
            user_emulator_patches_included=$true
            prior_candidate_configuration_included=$false
            source_modifications=@('ATRAC9 public dependency substitution','Initialize indexed shader before mesh-stage inspection','Reviewed performance ports from accepted B102/B103 lineage','Driver cache survives Save','Hash-bucketed SRT planning and shader compiler optimizations','GPU readback batching','Native XPR relocation retention and rebinding','Per-region BDA proofs and range-scoped upload waits','BryKytyPS5 BDA suballocation and exact fp32 math','Small CPU index range synchronization','GPU-completed descriptor reuse pool expansion','Recording worker and deferred submission disabled after B129 regression','In-place shader resource specialization and fused image remap traversal','In-place shader interface collection','Workspace-owned indirect sort storage reuse')
            launcher_mode='upstream -Baseline'
            settings_window_included=$true
            settings_vblank_range_hz=@(30,360)
            settings_vblank_default_hz=60
            settings_vblank_persists=$true
            portable_shaders_enabled=$false
            driver_cache_key='98edcf312ef7ea126af9bb5a876005fc746955313ea0535ba2563c766289753b'
            frozen_baseline_commit='fbebfd208be50ca1ce758da0aaf2c674f2348c28'
            frozen_baseline_branch='best131-frozen-stable-vblank-textures-audio'
            frozen_base_rendering_and_audio_user_confirmed=$true
            new_performance_result_confirmed=$false
            restored_performance=@('B102 shader recording and replay','B103 512-entry compute frontend cache','B103 quiet phase logs','accepted GPU worker CPU sets priority and QoS','SRT visited set','legacy resource scratch reuse','128 dispatch batch')
            obsolete_old_gc_patch_not_applied='public fork uses per-frame GC with BDA-aware collection'
            test_modes=@('resource_tracking legacy','resource_materialization','compute_frontend_cache','scalar_provenance','shader_cfg','IR validation on and release default','Mocked Vulkan recording and deferred submission ordering/ownership')
            upstream_fix_commits=@('e5738defa60a579dd076563f83d104b6d33be399','5a12d808ce9384db464484943ca0fb80bef3a4f8','a28de66fe2f431bcd3ee50c20c1388e00935e82b')
            cache_save_adaptation='Retain cache lifetime fix; always save content without size-only unchanged heuristic'
            upstream_renderer_commit='60a012f2852cbff1b825dac6ea373b9d6e432268'
            previous_candidate_commit='fbebfd208be50ca1ce758da0aaf2c674f2348c28'
            previous_candidate_performance_user_report='B131 crashes fixed and runs as intended; accepted as new frozen baseline'
            rejected_b129_performance='worse; recording/deferred remain disabled'
            previous_candidate_ci_passed=$true
            brykyty_ports=@('4068f4ac886dcd25acc52b6e3fa3e3800dc576a9 BDA suballocation adapted','5e224812df1354f89c7451e58fc540c476843dc0 exact fp32 helpers adapted')
            baseline_warmed_cache_performance_user_confirmed=$true
            vulkan_recording_enabled=$false
            deferred_submit_enabled=$false
            native_index_cleanup_commit='989af67edd0f9a94f763b44520ba849eebe8c16a'
            descriptor_pool_reuse_commit='540f97bd4d5f68f2c35bf00ce6cbf53540e83163'
            free_descriptor_sets_per_layout=2048
            free_descriptor_sets_total=16384
            shader_codegen_changed_from_b127=$false
            shader_preparation_upstream_ports=@('684330c9e474f2e65d5aa620d4616683fb4a70dc in-place specialization and fused IR traversal adapted only','f3dc5ee4a9e0725b17bd3e0a4ad1bdbeb0afc8a9 in-place shader interface collection')
            buffer_refresh_fusion_not_ported=$true
            indirect_sort_scratch_reuse=$true
            steady_state_fps_gain_confirmed=$false
            native_xpr_enabled=$true
            native_xpr_store_budget=256
            native_xpr_keep_frames=600
            frame_pipeline_enabled=$true
            readback_queue_mode=1
            async_upload_mode=2
            additional_tests=@('guest_readback_packing dirty-byte parity','GPU math SPIR-V emission','draw_run_arguments CPU','mocked Vulkan recording ordering ownership ring wrap and fallback')
            incompatible_ports_not_included=@('BryKytyPS5 texture binding memo and draw speculation require different renderer APIs','Existing device buffer-bounds fallback remains unchanged')
            ci_test_adaptation='Existing CPU draw argument checks isolated from Vulkan harness; GPU draw-range and rasterization tests remain available and are not certified by this runner'
            gpu_runtime_checks_in_ci=$false
            pgo_included=$false
            srt_aot_dll_included=$false
            game_shader_seeds_included=$false
          } | ConvertTo-Json | Set-Content "$out/build-receipt.json"
          Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt"
      - name: Verify Windows settings and launcher configuration
        shell: powershell
        run: |
          $out = (Resolve-Path '_Build/package').Path
          foreach ($file in @('settings.ps1','run-windows.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$out/$file", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          & "$out/settings.ps1" -CheckOnly
          if ($LASTEXITCODE) { throw 'Settings option check failed' }
          $fake = Join-Path $env:RUNNER_TEMP 'launcher-config-check'
          New-Item -ItemType Directory -Force $fake | Out-Null
          New-Item -ItemType File -Force "$fake/eboot.bin" | Out-Null
          $config = Get-Content "$out/launch.json" -Raw | ConvertFrom-Json
          $config.command = @('--','kyty_emulator.exe','--screen-width','1920','--screen-height','1080','--fullscreen','--present-mode','Mailbox','--shader-optimization-type','Performance','--vblank-frequency','120')
          $testConfig = Join-Path $env:RUNNER_TEMP 'launcher-test.json'
          $config | ConvertTo-Json -Depth 4 | Set-Content $testConfig -Encoding UTF8
          $text = (& "$out/run-windows.ps1" -Config $testConfig -Game $fake -Baseline -Set KYTY_PORTABLE_SHADERS=0,KYTY_DRIVER_CACHE_KEY=98edcf312ef7ea126af9bb5a876005fc746955313ea0535ba2563c766289753b,KYTY_SHADER_WARMUP=1,KYTY_SHADER_WARMUP_THREADS=12,KYTY_SHADER_WARMUP_SECONDS=60,KYTY_SHADER_WARMUP_FILE=_PipelineCache/warmup-legacy/recording.shaders,KYTY_PREPARATION_SCRATCH=1,KYTY_DISPATCH_BATCH=128,KYTY_BACKING_READ=1,KYTY_FRAME_PIPELINE=1,KYTY_READBACK_QUEUE=1,KYTY_READBACK_SLOTS=1,KYTY_ASYNC_UPLOAD=2,KYTY_BDA_DIRTY_REGIONS=1,KYTY_NATIVE_XPR=1,KYTY_NATIVE_XPR_RELOCATE=1,KYTY_NATIVE_XPR_STORE_BUDGET=256,KYTY_NATIVE_XPR_KEEP_FRAMES=600,KYTY_NATIVE_IMAGE_PROOF=1,KYTY_ASYNC_XPR_PIPELINES=1,KYTY_VULKAN_RECORDING=0,KYTY_DEFERRED_SUBMIT=0 -DryRun 6>&1 | Out-String)
          foreach ($expected in @('--screen-width 1920','--screen-height 1080','--fullscreen','--present-mode Mailbox','--shader-optimization-type Performance','--vblank-frequency 120')) {
            if (!$text.Contains($expected)) { throw "Launcher ignored setting: $expected" }
          }
          if (!$text.Contains('KYTY_PORTABLE_SHADERS=0') -or !$text.Contains('KYTY_DRIVER_CACHE_KEY=98edcf312ef7ea126af9bb5a876005fc746955313ea0535ba2563c766289753b')) {
            throw 'Launcher ignored the legacy binding or isolated cache override'
          }
          foreach ($expected in @('KYTY_VULKAN_RECORDING=0','KYTY_DEFERRED_SUBMIT=0','KYTY_FRAME_PIPELINE=1','KYTY_NATIVE_XPR=1','KYTY_NATIVE_XPR_STORE_BUDGET=256','KYTY_BDA_DIRTY_REGIONS=1','KYTY_ASYNC_UPLOAD=2','KYTY_READBACK_QUEUE=1','KYTY_SHADER_WARMUP=1','KYTY_PREPARATION_SCRATCH=1','KYTY_DISPATCH_BATCH=128')) {
            if (!$text.Contains($expected)) { throw "Launcher ignored proven performance override: $expected" }
          }
          $override = (& "$out/run-windows.ps1" -Config $testConfig -Game $fake -Baseline -Set KYTY_PORTABLE_SHADERS=0,KYTY_DRIVER_CACHE_KEY=98edcf312ef7ea126af9bb5a876005fc746955313ea0535ba2563c766289753b,KYTY_SHADER_WARMUP=1,KYTY_SHADER_WARMUP_THREADS=12,KYTY_SHADER_WARMUP_SECONDS=60,KYTY_SHADER_WARMUP_FILE=_PipelineCache/warmup-legacy/recording.shaders,KYTY_PREPARATION_SCRATCH=1,KYTY_DISPATCH_BATCH=128,KYTY_BACKING_READ=1,KYTY_FRAME_PIPELINE=1,KYTY_READBACK_QUEUE=1,KYTY_READBACK_SLOTS=1,KYTY_ASYNC_UPLOAD=2,KYTY_BDA_DIRTY_REGIONS=1,KYTY_NATIVE_XPR=1,KYTY_NATIVE_XPR_RELOCATE=1,KYTY_NATIVE_XPR_STORE_BUDGET=256,KYTY_NATIVE_XPR_KEEP_FRAMES=600,KYTY_NATIVE_IMAGE_PROOF=1,KYTY_ASYNC_XPR_PIPELINES=1,KYTY_VULKAN_RECORDING=0,KYTY_DEFERRED_SUBMIT=0 -Vblank 240 -DryRun 6>&1 | Out-String)
          if (!$override.Contains('--vblank-frequency 240') -or $override.Contains('--vblank-frequency 120')) { throw 'Explicit vblank override did not take precedence' }
          $defaults = (& "$out/run-windows.ps1" -Config "$out/launch.json" -Game $fake -Baseline -DryRun 6>&1 | Out-String)
          if (!$defaults.Contains('--vblank-frequency 60')) { throw 'Missing vblank setting did not default to 60 Hz' }
          Remove-Item "$out/game-path.txt" -ErrorAction SilentlyContinue
          Write-Host 'Settings syntax, option construction and upstream launcher consumption passed.'
      - name: Verify packaged shader preparation imports
        shell: pwsh
        run: |
          python -m pip install numpy
          if ($LASTEXITCODE) { throw 'Python dependency install failed' }
          python _Build/package/tools/local/static-precompile/precompile.py --help
          if ($LASTEXITCODE) { throw 'Packaged shader extraction dependencies missing' }
      - name: Upload clean standalone public fork
        uses: actions/upload-artifact@v4
        with:
