name: KytyPS5 clean public fork standalone
on:
  push:
    branches: [public-fork-clean-standalone]
    paths:
      - .github/workflows/b32-cache-source-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    name: Build standalone public fork with indexed draw crash fix
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout public performance source
        uses: actions/checkout@v4
        with:
          repository: chenxiao07/KytyPS5
          ref: bb0fbe7e9f22d9bf2455f486fbf1a9aa33a6354d
          path: source
          submodules: false
      - name: Pin available audio dependency and fetch submodules
        shell: pwsh
        run: |
          # The fork's ATRAC9 gitlink points to an unpublished commit.
          # Use an available public ATRAC9 revision; no user emulator patches are applied.
          git -C source update-index --cacheinfo 160000,ec8899dadf393f655f2871a94e0fe4b3d6220c9a,3rdparty/LibAtrac9
          if ($LASTEXITCODE) { throw 'Audio dependency pin failed' }
          git -C source submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE) { throw 'Source dependency checkout failed' }
          $actual = git -C source/3rdparty/LibAtrac9 rev-parse HEAD
          if ($actual -ne 'ec8899dadf393f655f2871a94e0fe4b3d6220c9a') { throw 'Unexpected ATRAC9 revision' }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install tested LLVM compiler
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '19.1.7'
      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Split-Path (Get-Command vcpkg).Source
          $hash = (Get-FileHash "$root\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "root=$root" >> $env:GITHUB_OUTPUT
          "port_hash=$hash" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: glslang_cache
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt
      - name: Install glslang
        shell: pwsh
        run: |
          $root = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
            if ($LASTEXITCODE) { throw 'glslang install failed' }
          }
          "$root\installed\x64-windows\tools\glslang" >> $env:GITHUB_PATH
      - name: Fix indexed draw shader initialization order
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('indexed-shader-init.patch', [Convert]::FromBase64String(''))
          git -C source apply --check ../indexed-shader-init.patch
          if ($LASTEXITCODE) { throw 'Indexed shader initialization patch does not match upstream' }
          git -C source apply ../indexed-shader-init.patch
          if ($LASTEXITCODE) { throw 'Indexed shader initialization patch failed' }
      - name: Configure portable optimized build
        shell: cmd
        run: >
          cmake -S source -B _Build/windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DKYTY_BUILD_LAUNCHER=OFF
          -DKYTY_MARCH=x86-64-v3 -DKYTY_THIN_LTO=ON
          -DKYTY_BUILD_ORIGIN=Fork -DKYTY_BUILD_REPOSITORY=${{ github.repository }}
          -DKYTY_RELEASE_TAG=CLEAN-PUBLIC-FORK-${{ github.run_number }}
          -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
      - name: Build emulator and shader preparation
        run: cmake --build _Build/windows --target kyty_emulator kyty_shader_precompile --parallel 4
      - name: Build unchanged resource regression checks
        run: cmake --build _Build/windows --target resource_tracking_tests resource_materialization_tests --parallel 4
      - name: Run unchanged resource regression checks
        shell: pwsh
        run: |
          # Upstream's full resource fixture assumes the legacy layout.
          # Test that layout without modifying its tests or production defaults.
          $env:KYTY_PORTABLE_SHADERS = '0'
          ctest --test-dir _Build/windows --output-on-failure -R "^(resource_tracking|resource_materialization)$"
          if ($LASTEXITCODE) { throw 'Upstream resource regression checks failed' }
      - name: Verify only the indexed draw crash fix is applied
        shell: pwsh
        run: |
          $changed = @(git -C source diff --name-only -- src local CMakeLists.txt)
          if ($LASTEXITCODE -or $changed.Count -ne 1 -or $changed[0] -ne 'src/graphics/host_gpu/renderer/renderDraw.cpp') {
            throw 'Unexpected production source modification'
          }
          git -C source apply --reverse --check ../indexed-shader-init.patch
          if ($LASTEXITCODE) { throw 'Indexed shader fix differs from the verified patch' }
      - name: Package portable candidate
        shell: pwsh
        run: |
          $out = '_Build/package'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item _Build/windows/kyty_emulator.exe,_Build/windows/kyty_shader_precompile.exe,_Build/windows/libwinpthread-1.dll $out
          Copy-Item source/run-windows.ps1,source/precompile-windows.ps1 $out
          [IO.File]::WriteAllBytes("$out/settings.ps1", [Convert]::FromBase64String(''))
          Set-Content "$out/settings.cmd" -Encoding ASCII -Value @(
            '@echo off',
            'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0settings.ps1"',
            'if errorlevel 1 pause')
          # No files, patches, or configuration from ci/perf40 or the user's builds.
          @{ checkpoint='clean-public-fork-indexed-shader-init'; environment=@{}; command=@('--','kyty_emulator.exe') } |
            ConvertTo-Json -Depth 4 | Set-Content "$out/launch.json" -Encoding UTF8
          Set-Content "$out/run.cmd" -Encoding ASCII -Value @(
            '@echo off',
            'if /I "%~1"=="settings" goto settings',
            'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0run-windows.ps1" -Baseline -Prompt %*',
            'goto finish',
            ':settings',
            'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0settings.ps1"',
            ':finish',
            'if errorlevel 1 pause')
          Set-Content "$out/precompile.cmd" -Encoding ASCII -Value @(
            '@echo off',
            'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0precompile-windows.ps1" %*',
            'if errorlevel 1 pause')
          Set-Content "$out/README.txt" -Value @(
            'Public chenxiao07/KytyPS5 source, not based on the user emulator.',
            'Fix: indexed indirect draws initialize the shader before checking its mesh stage.',
            'Extract into a NEW empty folder. Do not copy old launch.json, caches, patches, or DLLs.',
            'Run run.cmd and choose the folder containing eboot.bin.',
            'Open settings.cmd (or run.cmd settings) to change display, GPU, shader optimization and logging settings.',
            'Click Save, then relaunch the game. Settings are stored in launch.json.',
            'Uses the upstream -Baseline mode with no performance environment configuration.',
            'The upstream Windows red-zone protection, cache handling and logs remain enabled.',
            'This is not the private benchmark package. No private PGO, SRT AOT or game shader seeds.',
            'ATRAC9 uses public revision ec8899dadf393f655f2871a94e0fe4b3d6220c9a because the source gitlink is unavailable.',
            'Unchanged legacy resource tracking and materialization tests run in CI.',
            'Portable-specific and recording tests are not certified by this standalone workflow.')
          New-Item -ItemType Directory -Force "$out/tools/local" | Out-Null
          Copy-Item source/tools/local/static-precompile "$out/tools/local/" -Recurse
          New-Item -ItemType Directory -Force "$out/3rdparty/Vulkan-Headers/include/vulkan","$out/src/graphics/guest_gpu" | Out-Null
          Copy-Item source/3rdparty/Vulkan-Headers/include/vulkan/vulkan_core.h "$out/3rdparty/Vulkan-Headers/include/vulkan/"
          Copy-Item source/src/graphics/guest_gpu/gpu_defs.h "$out/src/graphics/guest_gpu/"
          Copy-Item source/3rdparty/winpthread/COPYING "$out/WINPTHREAD-COPYING.txt"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-Item "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" |
            Where-Object { $_.Parent.Parent.Name -match '^\d+\.' } |
            Sort-Object { [version]$_.Parent.Parent.Name } | Select-Object -Last 1
          if (!$crt) { throw 'VC runtime redistributables missing' }
          Copy-Item "$($crt.FullName)\msvcp140*.dll","$($crt.FullName)\vcruntime140*.dll" $out
          Copy-Item source/LICENSE "$out/LICENSE.txt"
          Copy-Item source/LICENSES "$out/LICENSES" -Recurse
          @{
            source_repository='chenxiao07/KytyPS5'
            source_commit='bb0fbe7e9f22d9bf2455f486fbf1a9aa33a6354d'
            atrac9_commit='ec8899dadf393f655f2871a94e0fe4b3d6220c9a'
            unpublished_atrac9_optimization_included=$false
            packaging_commit=$env:GITHUB_SHA
            user_emulator_patches_included=$false
            prior_candidate_configuration_included=$false
            source_modifications=@('ATRAC9 public dependency substitution','Initialize indexed shader before mesh-stage inspection')
            launcher_mode='upstream -Baseline'
            settings_window_included=$true
            test_modes=@('resource_tracking legacy','resource_materialization')
            pgo_included=$false
            srt_aot_dll_included=$false
            game_shader_seeds_included=$false
          } | ConvertTo-Json | Set-Content "$out/build-receipt.json"
          Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt"
      - name: Verify Windows settings and launcher configuration
        shell: powershell
        run: |
          $out = (Resolve-Path '_Build/package').Path
          foreach ($file in @('settings.ps1','run-windows.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$out/$file", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          & "$out/settings.ps1" -CheckOnly
          if ($LASTEXITCODE) { throw 'Settings option check failed' }
          $fake = Join-Path $env:RUNNER_TEMP 'launcher-config-check'
          New-Item -ItemType Directory -Force $fake | Out-Null
          New-Item -ItemType File -Force "$fake/eboot.bin" | Out-Null
          $config = Get-Content "$out/launch.json" -Raw | ConvertFrom-Json
          $config.command = @('--','kyty_emulator.exe','--screen-width','1920','--screen-height','1080','--fullscreen','--present-mode','Mailbox','--shader-optimization-type','Performance')
          $testConfig = Join-Path $env:RUNNER_TEMP 'launcher-test.json'
          $config | ConvertTo-Json -Depth 4 | Set-Content $testConfig -Encoding UTF8
          $text = (& "$out/run-windows.ps1" -Config $testConfig -Game $fake -Baseline -DryRun 6>&1 | Out-String)
          foreach ($expected in @('--screen-width 1920','--screen-height 1080','--fullscreen','--present-mode Mailbox','--shader-optimization-type Performance')) {
            if (!$text.Contains($expected)) { throw "Launcher ignored setting: $expected" }
          }
          Remove-Item "$out/game-path.txt" -ErrorAction SilentlyContinue
          Write-Host 'Settings syntax, option construction and upstream launcher consumption passed.'
      - name: Verify packaged shader preparation imports
        shell: pwsh
        run: |
          python -m pip install numpy
          if ($LASTEXITCODE) { throw 'Python dependency install failed' }
          python _Build/package/tools/local/static-precompile/precompile.py --help
          if ($LASTEXITCODE) { throw 'Packaged shader extraction dependencies missing' }
      - name: Upload clean standalone public fork
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-CLEAN-PUBLIC-FORK-Windows-x64-${{ github.run_number }}
          path: _Build/package/**
          if-no-files-found: error
